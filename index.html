<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ops Task Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#ffffff; --surface:#f6f7f9; --panel:#ffffff; --line:#d7dce3;
    --text:#1b2430; --text-dim:#8891a0;
    --blue:#2563eb; --blue-bg:#eaf0fe;
    --waiting:#e0342d; --waiting-bg:#fdeceb;
    --prog:#f59e0b; --prog-bg:#fef3dd;
    --done:#22c55e; --done-bg:#e8f9ee;
    --purple:#7c3aed; --purple-bg:#f1e9fe;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--surface); color:var(--text); font-family:'IBM Plex Sans Arabic',sans-serif; min-height:100vh;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{cursor:pointer; font-family:inherit;}

  /* ---------- LOGIN ---------- */
  #loginScreen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
  .login-card{background:var(--panel); border:1.5px solid var(--line); border-radius:18px; padding:28px 22px; width:100%; max-width:380px; box-shadow:0 10px 30px rgba(0,0,0,.06);}
  .login-card h2{margin:0 0 4px; font-size:19px;}
  .login-card .hint{font-size:12.5px; color:var(--text-dim); margin:0 0 20px;}
  .role-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px;}
  .role-btn{padding:16px 8px; border-radius:12px; border:1.5px solid var(--line); background:var(--surface); font-weight:700; font-size:13.5px; text-align:center; transition:.15s;}
  .role-btn small{display:block; font-weight:500; color:var(--text-dim); font-size:11px; margin-top:3px;}
  .role-btn.active{border-color:var(--blue); background:var(--blue-bg); color:var(--blue);}
  #pinStep{margin-top:18px; display:none;}
  #pinStep .role-chosen{font-size:13px; color:var(--text-dim); margin-bottom:10px;}
  #pinStep .role-chosen b{color:var(--text);}
  #pinInput{width:100%; padding:14px; border-radius:10px; border:1.5px solid var(--line); font-size:20px; text-align:center; letter-spacing:3px; font-family:'IBM Plex Mono',monospace;}
  #loginBtn{width:100%; margin-top:12px; padding:13px; background:var(--blue); color:#fff; border:none; border-radius:10px; font-weight:700; font-size:14.5px;}
  #loginBtn:disabled{background:#b9c3d6;}
  #loginError{color:var(--waiting); font-size:12.5px; margin-top:10px; min-height:16px; text-align:center;}
  #deviceWarning{display:none; background:var(--prog-bg); border:1px solid var(--prog); border-radius:10px; padding:12px; margin-top:12px; font-size:12.5px;}
  #deviceWarning button{margin-top:8px; padding:8px 14px; border-radius:8px; border:none; font-size:12px; font-weight:700;}
  #deviceContinue{background:var(--prog); color:#fff; margin-left:6px;}
  #deviceCancel{background:#fff; border:1px solid var(--line) !important;}

  /* ---------- APP SHELL ---------- */
  #appScreen{display:none;}
  header{background:var(--panel); border-bottom:1.5px solid var(--line); padding:14px 16px; position:sticky; top:0; z-index:30;}
  .header-inner{max-width:980px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:9px;}
  .brand-dot{width:9px; height:9px; border-radius:50%; background:var(--blue);}
  .brand h1{font-size:15px; margin:0; font-weight:800;}
  .id-badge{display:flex; align-items:center; gap:8px;}
  .id-pill{background:var(--surface); border:1.5px solid var(--line); border-radius:20px; padding:6px 14px; font-size:12.5px; font-weight:700; font-family:'IBM Plex Mono',monospace;}
  .logout-btn{background:none; border:1.5px solid var(--line); border-radius:8px; padding:6px 10px; font-size:11.5px; color:var(--text-dim);}

  .vessel-bar{max-width:980px; margin:14px auto 0; padding:0 16px;}
  .vessel-card{background:var(--panel); border:1.5px solid var(--line); border-radius:14px; padding:14px 16px;}
  .vessel-card .title{font-size:11.5px; color:var(--text-dim); font-weight:700; margin-bottom:10px;}
  .vessel-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .vessel-grid .full{grid-column:1/-1;}
  .vessel-grid input{padding:10px; border-radius:8px; border:1.5px solid var(--line); font-size:13px; width:100%;}
  .vessel-grid label{font-size:10.5px; color:var(--text-dim); display:block; margin-bottom:3px;}
  .vessel-save{margin-top:10px; padding:9px 16px; background:var(--blue); color:#fff; border:none; border-radius:8px; font-size:12.5px; font-weight:700;}
  .vessel-readonly{font-size:13px; line-height:1.9;}

  .tabs{max-width:980px; margin:14px auto 0; padding:0 16px; display:flex; gap:8px;}
  .tab-btn{flex:1; padding:11px; border-radius:10px; border:1.5px solid var(--line); background:var(--panel); font-weight:700; font-size:13px; color:var(--text-dim);}
  .tab-btn.active{background:var(--blue); color:#fff; border-color:var(--blue);}

  main{max-width:980px; margin:0 auto; padding:16px;}
  .panel{background:var(--panel); border:1.5px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px;}
  .panel-title{font-size:13.5px; font-weight:800; margin:0 0 12px; display:flex; align-items:center; justify-content:space-between;}
  .empty-msg{color:var(--text-dim); font-size:13px; text-align:center; padding:24px 0;}

  .new-task-btn{width:100%; padding:13px; background:var(--blue); color:#fff; border:none; border-radius:10px; font-weight:700; font-size:13.5px; margin-bottom:14px;}

  .task-card{border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px;}
  .task-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .task-container{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:14px;}
  .badge{font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px;}
  .badge.waiting{background:var(--waiting-bg); color:var(--waiting);}
  .badge.updated{background:var(--prog-bg); color:var(--prog);}
  .badge.done{background:var(--done-bg); color:var(--done);}
  .task-grid{display:grid; grid-template-columns:1fr 1fr; gap:6px; font-size:12.5px; color:var(--text-dim); margin-bottom:8px;}
  .task-grid b{color:var(--text); font-weight:600;}
  .task-actions{display:flex; gap:8px;}
  .task-actions button{flex:1; padding:9px; border-radius:8px; border:none; font-weight:700; font-size:12.5px;}
  .btn-primary{background:var(--blue); color:#fff;}
  .btn-success{background:var(--done); color:#fff;}
  .btn-dispatch{background:var(--purple); color:#fff;}
  .confirm-note{font-size:11.5px; color:var(--text-dim); background:var(--surface); border-radius:8px; padding:8px 10px; margin-top:6px;}

  .stats-row{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:14px;}
  .stat-box{background:var(--panel); border:1.5px solid var(--line); border-radius:12px; padding:14px 10px; text-align:center;}
  .stat-box .num{font-size:22px; font-weight:800;}
  .stat-box .lbl{font-size:11px; color:var(--text-dim); margin-top:2px;}
  .stat-box.waiting .num{color:var(--waiting);}
  .stat-box.updated .num{color:var(--prog);}
  .stat-box.done .num{color:var(--done);}

  .kanban-col{margin-bottom:16px;}
  .kanban-col h3{font-size:12.5px; margin:0 0 8px; display:flex; align-items:center; gap:6px;}
  .dot{width:8px; height:8px; border-radius:50%;}

  .export-btn{width:100%; padding:12px; background:var(--purple); color:#fff; border:none; border-radius:10px; font-weight:700; font-size:13px; margin-bottom:14px;}

  /* ---------- MODAL ---------- */
  .modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; align-items:flex-end; justify-content:center; z-index:100;}
  .modal-overlay.show{display:flex;}
  .modal-box{background:#fff; width:100%; max-width:420px; border-radius:18px 18px 0 0; padding:20px; max-height:88vh; overflow-y:auto;}
  .modal-box h3{margin:0 0 14px; font-size:15px;}
  .field{margin-bottom:12px;}
  .field label{font-size:12px; color:var(--text-dim); display:block; margin-bottom:5px;}
  .field input, .field select{width:100%; padding:12px; border-radius:9px; border:1.5px solid var(--line); font-size:14px;}
  .modal-actions{display:flex; gap:8px; margin-top:16px;}
  .modal-actions button{flex:1; padding:12px; border-radius:9px; border:none; font-weight:700; font-size:13.5px;}
  .btn-cancel{background:var(--surface); color:var(--text-dim); border:1.5px solid var(--line) !important;}
  .modal-error{color:var(--waiting); font-size:12px; margin-top:6px; min-height:14px;}

  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#1b2430; color:#fff; padding:11px 20px; border-radius:30px; font-size:13px; z-index:200; display:none;}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginScreen">
  <div class="login-card">
    <h2>الدخول للوحة العمليات</h2>
    <p class="hint">ادخل الـ ID والباسورد اللي معاك</p>
    <div class="field"><label>ID</label><input type="text" id="idInput" inputmode="numeric" placeholder="مثال: 1001"></div>
    <div class="field"><label>Password</label><input type="text" id="pinInput" inputmode="numeric" placeholder="••••"></div>
    <button id="loginBtn">دخول</button>
    <div id="loginError"></div>
    <div id="deviceWarning">
      هذا الـ ID متسجّل دخول من جهاز تاني حاليًا. لو كملت، الجهاز التاني ممكن يتقفل تلقائيًا.
      <div>
        <button id="deviceContinue">أكمل من هنا</button>
        <button id="deviceCancel">إلغاء</button>
      </div>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="appScreen">
  <header>
    <div class="header-inner">
      <div class="brand"><span class="brand-dot"></span><h1>Ops Task Board</h1></div>
      <div class="id-badge">
        <span class="id-pill mono" id="myIdDisplay"></span>
        <button class="logout-btn" id="logoutBtn">خروج</button>
      </div>
    </div>
  </header>

  <div class="vessel-bar">
    <div class="vessel-card">
      <div class="title">المراكب الحالية</div>
      <div id="vesselPlannerControls" style="display:none;">
        <div class="vessel-grid">
          <div class="full"><input id="newVesselName" placeholder="اسم مركب جديد، مثال: MSC LORETO"></div>
        </div>
        <button class="vessel-save" id="addVesselBtn">＋ إضافة مركب</button>
      </div>
      <div id="vesselList" class="vessel-readonly"></div>
    </div>
  </div>

  <div class="tabs" id="tabsBar">
    <button class="tab-btn active" data-tab="mine">لوحتي</button>
    <button class="tab-btn" data-tab="dash">الداشبورد المشترك</button>
  </div>

  <main>
    <div id="tabMine"></div>
    <div id="tabDash" style="display:none;"></div>
  </main>
</div>

<!-- ============ MODALS ============ -->
<div class="modal-overlay" id="newTaskModal">
  <div class="modal-box">
    <h3>تاسك جديد</h3>
    <div class="field" id="ntVesselField" style="display:none;">
      <label>المركب</label>
      <select id="ntVessel"></select>
    </div>
    <div class="field"><label>رقم الحاوية</label><input id="ntContainer" placeholder="مثال: MSKU1234567"></div>
    <div class="field"><label>مكان المركب</label><input id="ntPosition" placeholder="مثال: 74 14 96"></div>
    <div class="field"><label>رقم الكرين</label><input id="ntCrane" placeholder="مثال: 3"></div>
    <div class="field"><label>رقم الترك</label><input id="ntTruck" placeholder="مثال: 123"></div>
    <div class="modal-error" id="ntError"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('newTaskModal')">إلغاء</button>
      <button class="btn-primary" id="ntSubmit">إرسال</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="updateModal">
  <div class="modal-box">
    <h3>تحديث المكان — <span id="updContainerLabel" class="mono"></span></h3>
    <div class="field"><label>المكان الجديد</label><input id="updNewLocation" placeholder="مثال: Yard B12-04"></div>
    <div class="modal-error" id="updError"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('updateModal')">إلغاء</button>
      <button class="btn-primary" id="updSubmit">تأكيد التحديث</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="dispatchModal">
  <div class="modal-box">
    <h3>إعادة توزيع — <span id="dispContainerLabel" class="mono"></span></h3>
    <div class="field"><label>المسؤول الحالي عن التأكيد</label><input id="dispCurrent" disabled></div>
    <div class="field"><label>الـ ID الجديد (مثال: 1005)</label><input id="dispNewId" placeholder="1005"></div>
    <div class="modal-error" id="dispError"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('dispatchModal')">إلغاء</button>
      <button class="btn-dispatch" id="dispSubmit">تغيير المسؤول</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= CONSTANTS ================= */
const TASKS_KEY = 'ops-board:tasks';
const ARCHIVE_KEY = 'ops-board:archive';
const VESSELS_KEY = 'ops-board:vessels';
const SESSIONS_KEY = 'ops-board:sessions';
const MY_ID_KEY = 'ops-board:my-id';
const DEVICE_TOKEN_KEY = 'ops-board:device-token';

const ROLE_NAMES = { W:'Deck & Wharf', P:'Planner', D:'Dispatcher', M:'Manager' };

/* قائمة المستخدمين المسموح لهم بالدخول: ID -> {password, role} */
const USERS = {"1000":{"password":"2824","role":"W"},"1001":{"password":"1409","role":"W"},"1002":{"password":"5506","role":"W"},"1003":{"password":"5012","role":"W"},"1004":{"password":"4657","role":"W"},"1005":{"password":"3286","role":"W"},"1006":{"password":"2679","role":"W"},"1007":{"password":"9935","role":"W"},"1008":{"password":"2424","role":"W"},"1009":{"password":"7912","role":"W"},"1010":{"password":"1520","role":"P"},"1011":{"password":"1488","role":"P"},"1012":{"password":"2535","role":"P"},"1013":{"password":"4582","role":"P"},"1014":{"password":"4811","role":"P"},"1015":{"password":"9279","role":"D"},"1016":{"password":"1434","role":"D"},"1017":{"password":"4257","role":"D"},"1018":{"password":"9928","role":"M"},"1019":{"password":"7873","role":"M"},"1020":{"password":"4611","role":"M"}};

let myId = null, myRole = null;
let tasks = [], vessels = [], sessions = {};
let currentTab = 'mine';

/* ================= STORAGE HELPERS ================= */
async function storageGet(key, shared, fallback){
  try{
    const r = await window.storage.get(key, shared);
    return (r && r.value !== undefined) ? JSON.parse(r.value) : fallback;
  }catch(e){ return fallback; }
}
async function storageSet(key, value, shared){
  try{ await window.storage.set(key, JSON.stringify(value), shared); }
  catch(e){ console.error('storage set failed', key, e); }
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display='block';
  clearTimeout(t._timer);
  t._timer = setTimeout(()=> t.style.display='none', 2200);
}

function openModal(id){ document.getElementById(id).classList.add('show'); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }

function genToken(){ return Math.random().toString(36).slice(2) + Date.now().toString(36); }

/* ================= LOGIN FLOW ================= */
document.getElementById('loginBtn').addEventListener('click', ()=> attemptLogin(false));
document.getElementById('deviceContinue').addEventListener('click', ()=> attemptLogin(true));
document.getElementById('deviceCancel').addEventListener('click', ()=>{
  document.getElementById('deviceWarning').style.display = 'none';
});

async function attemptLogin(forceOverride){
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  const id = document.getElementById('idInput').value.trim();
  const pw = document.getElementById('pinInput').value.trim();

  if(!id || !pw){ errEl.textContent = 'اكتب الـ ID والباسورد'; return; }

  const user = USERS[id];
  if(!user || user.password !== pw){
    errEl.textContent = 'الـ ID أو الباسورد غلط';
    return;
  }

  sessions = await storageGet(SESSIONS_KEY, true, {});
  let localToken = localStorage.getItem(DEVICE_TOKEN_KEY);
  if(!localToken){ localToken = genToken(); localStorage.setItem(DEVICE_TOKEN_KEY, localToken); }

  if(sessions[id] && sessions[id] !== localToken && !forceOverride){
    document.getElementById('deviceWarning').style.display = 'block';
    return;
  }

  sessions[id] = localToken;
  await storageSet(SESSIONS_KEY, sessions, true);

  myId = id; myRole = user.role;
  localStorage.setItem(MY_ID_KEY, myId);

  enterApp();
}

document.getElementById('logoutBtn').addEventListener('click', ()=>{
  localStorage.removeItem(MY_ID_KEY);
  location.reload();
});

/* ================= APP ENTRY ================= */
async function enterApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'block';
  document.getElementById('myIdDisplay').textContent = myId + ' · ' + ROLE_NAMES[myRole];

  if(myRole === 'P'){
    document.getElementById('vesselPlannerControls').style.display = 'block';
  }

  if(myRole === 'M'){
    document.getElementById('tabsBar').querySelector('[data-tab="mine"]').style.display = 'none';
    switchTab('dash');
  }

  await loadAll();
  render();
  setInterval(loadAll, 4000);
}

/* auto-login if already have id stored on this device */
(async function initialCheck(){
  const savedId = localStorage.getItem(MY_ID_KEY);
  if(savedId && USERS[savedId]){
    myId = savedId; myRole = USERS[savedId].role;
    let localToken = localStorage.getItem(DEVICE_TOKEN_KEY);
    if(!localToken){ localToken = genToken(); localStorage.setItem(DEVICE_TOKEN_KEY, localToken); }
    sessions = await storageGet(SESSIONS_KEY, true, {});
    sessions[savedId] = localToken;
    await storageSet(SESSIONS_KEY, sessions, true);
    enterApp();
  }
})();

/* ================= DATA LOAD ================= */
async function loadAll(){
  tasks = await storageGet(TASKS_KEY, true, []);
  vessels = await storageGet(VESSELS_KEY, true, []);
  render();
}

/* ================= TABS ================= */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=> switchTab(btn.dataset.tab));
});
function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b=> b.classList.toggle('active', b.dataset.tab===tab));
  document.getElementById('tabMine').style.display = tab==='mine' ? 'block':'none';
  document.getElementById('tabDash').style.display = tab==='dash' ? 'block':'none';
  render();
}

/* ================= VESSELS (Planner manages) ================= */
document.getElementById('addVesselBtn').addEventListener('click', async ()=>{
  const name = document.getElementById('newVesselName').value.trim();
  if(!name) return;
  vessels.push({ id: 'v_' + Date.now(), name, addedBy: myId, addedAt: Date.now() });
  await storageSet(VESSELS_KEY, vessels, true);
  document.getElementById('newVesselName').value = '';
  toast('اتضاف المركب ✓');
  renderVessel();
});

async function removeVessel(vId){
  vessels = vessels.filter(v=>v.id!==vId);
  await storageSet(VESSELS_KEY, vessels, true);
  renderVessel();
}

function renderVessel(){
  const el = document.getElementById('vesselList');
  if(!vessels.length){
    el.innerHTML = '<span style="color:var(--text-dim)">لسه مفيش مراكب مضافة</span>';
    return;
  }
  el.innerHTML = vessels.map(v=>{
    const removeBtn = (myRole==='P')
      ? ` <button style="border:none;background:none;color:var(--waiting);cursor:pointer;font-size:12px;" onclick="removeVessel('${v.id}')">✕ إزالة</button>`
      : '';
    return `<div style="margin-bottom:4px;"><b>${esc(v.name)}</b>${removeBtn}</div>`;
  }).join('');
}

/* ================= NEW TASK (W) ================= */
function openNewTaskModal(){
  const errEl = document.getElementById('ntError');
  errEl.textContent = '';

  if(!vessels.length){
    errEl.textContent = 'مفيش مركب مضاف. اطلب من الـ Planner يضيف المركب الأول';
    return;
  }

  const fieldEl = document.getElementById('ntVesselField');
  if(vessels.length === 1){
    fieldEl.style.display = 'none';
  } else {
    fieldEl.style.display = 'block';
    document.getElementById('ntVessel').innerHTML = vessels.map(v=>`<option value="${v.id}">${esc(v.name)}</option>`).join('');
  }
  openModal('newTaskModal');
}

document.getElementById('ntSubmit').addEventListener('click', async ()=>{
  const container = document.getElementById('ntContainer').value.trim();
  const position = document.getElementById('ntPosition').value.trim();
  const crane = document.getElementById('ntCrane').value.trim();
  const truck = document.getElementById('ntTruck').value.trim();
  const errEl = document.getElementById('ntError');

  if(!container || !position || !crane || !truck){
    errEl.textContent = 'من فضلك املأ كل الحقول'; return;
  }

  let chosenVessel;
  if(vessels.length === 1){
    chosenVessel = vessels[0];
  } else {
    const vId = document.getElementById('ntVessel').value;
    chosenVessel = vessels.find(v=>v.id===vId);
  }
  if(!chosenVessel){ errEl.textContent = 'اختر المركب'; return; }

  const task = {
    id: 'tk_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    container, vesselPosition: position, crane, truck,
    from: myId,
    status: 'waiting',
    createdAt: Date.now(),
    vesselName: chosenVessel.name,
    updatedBy: null, newLocation: null, updatedAt: null,
    assignedConfirmer: myId,
    dispatcherBy: null, dispatcherAt: null,
    confirmedBy: null, confirmedAt: null
  };

  tasks.push(task);
  await storageSet(TASKS_KEY, tasks, true);
  toast('اتبعت التاسك ✓');
  closeModal('newTaskModal');
  ['ntContainer','ntPosition','ntCrane','ntTruck'].forEach(id=> document.getElementById(id).value='');
  errEl.textContent = '';
  render();
});

/* ================= PLANNER UPDATE ================= */
let updatingTaskId = null;
function openUpdateModal(taskId){
  const t = tasks.find(x=>x.id===taskId);
  updatingTaskId = taskId;
  document.getElementById('updContainerLabel').textContent = t.container;
  document.getElementById('updNewLocation').value = '';
  document.getElementById('updError').textContent = '';
  openModal('updateModal');
}
document.getElementById('updSubmit').addEventListener('click', async ()=>{
  const val = document.getElementById('updNewLocation').value.trim();
  if(!val){ document.getElementById('updError').textContent = 'اكتب المكان الجديد'; return; }
  const t = tasks.find(x=>x.id===updatingTaskId);
  if(!t) return;
  t.status = 'updated';
  t.updatedBy = myId;
  t.newLocation = val;
  t.updatedAt = Date.now();
  await storageSet(TASKS_KEY, tasks, true);
  toast('اتحدّث ✓');
  closeModal('updateModal');
  render();
});

/* ================= DISPATCHER REASSIGN ================= */
let dispatchingTaskId = null;
function openDispatchModal(taskId){
  const t = tasks.find(x=>x.id===taskId);
  dispatchingTaskId = taskId;
  document.getElementById('dispContainerLabel').textContent = t.container;
  document.getElementById('dispCurrent').value = t.assignedConfirmer;
  document.getElementById('dispNewId').value = '';
  document.getElementById('dispError').textContent = '';
  openModal('dispatchModal');
}
document.getElementById('dispSubmit').addEventListener('click', async ()=>{
  const newId = document.getElementById('dispNewId').value.trim();
  const errEl = document.getElementById('dispError');
  const targetUser = USERS[newId];
  if(!targetUser || targetUser.role !== 'W'){
    errEl.textContent = 'الـ ID ده مش مسجل كـ Deck & Wharf'; return;
  }
  const t = tasks.find(x=>x.id===dispatchingTaskId);
  if(!t) return;
  t.assignedConfirmer = newId;
  t.dispatcherBy = myId;
  t.dispatcherAt = Date.now();
  await storageSet(TASKS_KEY, tasks, true);
  toast('اتغيّر المسؤول ✓');
  closeModal('dispatchModal');
  render();
});

/* ================= WHARF CONFIRM ================= */
async function confirmTask(taskId){
  const idx = tasks.findIndex(x=>x.id===taskId);
  if(idx === -1) return;
  const t = tasks[idx];
  t.status = 'done';
  t.confirmedBy = myId;
  t.confirmedAt = Date.now();

  const archive = await storageGet(ARCHIVE_KEY, true, []);
  archive.push(t);
  await storageSet(ARCHIVE_KEY, archive, true);

  tasks.splice(idx,1);
  await storageSet(TASKS_KEY, tasks, true);
  toast('تم ✓ واتسجل في الأرشيف');
  render();
}

/* ================= EXPORT EXCEL ================= */
async function exportExcel(){
  if(myRole !== 'P' && myRole !== 'M'){ toast('التصدير متاح للـ Planner والـ Manager بس'); return; }
  const archive = await storageGet(ARCHIVE_KEY, true, []);
  if(!archive.length){ toast('لسه مفيش داتا في الأرشيف'); return; }

  const rows = archive.map(t => ({
    'المركب': t.vesselName || '',
    'رقم الحاوية': t.container,
    'مكان المركب': t.vesselPosition,
    'الكرين': t.crane,
    'الترك': t.truck,
    'بعت الطلب (W)': t.from,
    'وقت الطلب': fmtDate(t.createdAt),
    'حدّث (Planner)': t.updatedBy || '',
    'المكان الجديد': t.newLocation || '',
    'وقت التحديث': t.updatedAt ? fmtDate(t.updatedAt) : '',
    'Dispatcher (لو حصل تغيير)': t.dispatcherBy || '',
    'وقت تغيير Dispatcher': t.dispatcherAt ? fmtDate(t.dispatcherAt) : '',
    'أكّد (W)': t.confirmedBy || '',
    'وقت التأكيد': t.confirmedAt ? fmtDate(t.confirmedAt) : ''
  }));

  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Tasks');
  XLSX.writeFile(wb, 'ops-task-board-export.xlsx');
}

/* ================= UTIL ================= */
function esc(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(ts){ return new Date(ts).toLocaleString('ar-EG'); }
function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return 'دلوقتي';
  if(s<3600) return Math.floor(s/60)+' د';
  return Math.floor(s/3600)+' س';
}

/* ================= RENDER ================= */
function render(){
  renderVessel();
  if(currentTab==='mine') renderMine();
  else renderDash();
}

function badge(status){
  const map = { waiting:['waiting','في الانتظار'], updated:['updated','اتحدّث'], done:['done','تم'] };
  const [cls,label] = map[status];
  return `<span class="badge ${cls}">${label}</span>`;
}

function taskGrid(t){
  return `<div class="task-grid">
    <div class="full" style="grid-column:1/-1;">المركب: <b>${esc(t.vesselName)}</b></div>
    <div>مكان المركب: <b>${esc(t.vesselPosition)}</b></div>
    <div>الكرين: <b>${esc(t.crane)}</b></div>
    <div>الترك: <b>${esc(t.truck)}</b></div>
    <div>بعتها: <b>${esc(t.from)}</b></div>
    ${t.newLocation ? `<div class="full" style="grid-column:1/-1;">المكان الجديد: <b>${esc(t.newLocation)}</b> — بواسطة ${esc(t.updatedBy)}</div>` : ''}
    ${t.dispatcherBy ? `<div class="full" style="grid-column:1/-1;">Dispatcher غيّر المسؤول لـ <b>${esc(t.assignedConfirmer)}</b> (${esc(t.dispatcherBy)})</div>` : ''}
  </div>`;
}

function renderMine(){
  const el = document.getElementById('tabMine');
  let html = '';

  if(myRole === 'W'){
    html += `<button class="new-task-btn" onclick="openNewTaskModal()">＋ تاسك جديد</button>`;

    const mySent = tasks.filter(t=>t.from===myId);
    html += `<div class="panel"><div class="panel-title">طلباتي (${mySent.length})</div>`;
    if(!mySent.length) html += `<div class="empty-msg">مفيش طلبات لسه</div>`;
    mySent.forEach(t=>{ html += renderTaskCard(t, false); });
    html += `</div>`;

    const needConfirm = tasks.filter(t=>t.status==='updated' && t.assignedConfirmer===myId);
    html += `<div class="panel"><div class="panel-title">محتاجة تأكيدي (${needConfirm.length})</div>`;
    if(!needConfirm.length) html += `<div class="empty-msg">مفيش حاجة محتاجة تأكيد دلوقتي</div>`;
    needConfirm.forEach(t=>{ html += renderTaskCard(t, true); });
    html += `</div>`;
  }

  else if(myRole === 'P'){
    const waiting = tasks.filter(t=>t.status==='waiting');
    html += `<div class="panel"><div class="panel-title">تاسكات محتاجة تحديث (${waiting.length})</div>`;
    if(!waiting.length) html += `<div class="empty-msg">مفيش تاسكات في الانتظار</div>`;
    waiting.forEach(t=>{
      html += `<div class="task-card">
        <div class="task-top"><span class="task-container mono">${esc(t.container)}</span>${badge(t.status)}</div>
        ${taskGrid(t)}
        <div class="task-actions"><button class="btn-primary" onclick="openUpdateModal('${t.id}')">تحديث المكان</button></div>
      </div>`;
    });
    html += `</div>`;

    const myUpdated = tasks.filter(t=>t.updatedBy===myId);
    if(myUpdated.length){
      html += `<div class="panel"><div class="panel-title">آخر تحديثاتي (${myUpdated.length})</div>`;
      myUpdated.forEach(t=>{ html += renderTaskCard(t, false); });
      html += `</div>`;
    }
  }

  else if(myRole === 'D'){
    const updated = tasks.filter(t=>t.status==='updated');
    html += `<div class="panel"><div class="panel-title">تاسكات محتاجة تأكيد (${updated.length})</div>`;
    if(!updated.length) html += `<div class="empty-msg">مفيش تاسكات محتاجة إعادة توزيع دلوقتي</div>`;
    updated.forEach(t=>{
      html += `<div class="task-card">
        <div class="task-top"><span class="task-container mono">${esc(t.container)}</span>${badge(t.status)}</div>
        ${taskGrid(t)}
        <div class="confirm-note">المسؤول عن التأكيد حاليًا: <b>${esc(t.assignedConfirmer)}</b></div>
        <div class="task-actions" style="margin-top:8px;"><button class="btn-dispatch" onclick="openDispatchModal('${t.id}')">تغيير المسؤول</button></div>
      </div>`;
    });
    html += `</div>`;
  }

  el.innerHTML = html;
}

function renderTaskCard(t, showConfirmBtn){
  let actions = '';
  if(showConfirmBtn){
    actions = `<div class="task-actions"><button class="btn-success" onclick="confirmTask('${t.id}')">تأكيد الاستلام</button></div>`;
  }
  return `<div class="task-card">
    <div class="task-top"><span class="task-container mono">${esc(t.container)}</span>${badge(t.status)}</div>
    ${taskGrid(t)}
    ${actions}
  </div>`;
}

function renderDash(){
  const el = document.getElementById('tabDash');
  const waiting = tasks.filter(t=>t.status==='waiting');
  const updated = tasks.filter(t=>t.status==='updated');

  let html = '';
  if(myRole === 'P' || myRole === 'M'){
    html += `<button class="export-btn" onclick="exportExcel()">⬇ تصدير Excel (كل السجل)</button>`;
  }

  html += `<div class="stats-row">
    <div class="stat-box waiting"><div class="num">${waiting.length}</div><div class="lbl">في الانتظار</div></div>
    <div class="stat-box updated"><div class="num">${updated.length}</div><div class="lbl">اتحدّث</div></div>
    <div class="stat-box done"><div class="num" id="doneTodayCount">-</div><div class="lbl">تم اليوم</div></div>
  </div>`;

  html += `<div class="panel kanban-col"><h3><span class="dot" style="background:var(--waiting)"></span> في الانتظار (${waiting.length})</h3>`;
  if(!waiting.length) html += `<div class="empty-msg">لا يوجد</div>`;
  waiting.forEach(t=>{ html += renderTaskCard(t,false); });
  html += `</div>`;

  html += `<div class="panel kanban-col"><h3><span class="dot" style="background:var(--prog)"></span> اتحدّث - في انتظار تأكيد (${updated.length})</h3>`;
  if(!updated.length) html += `<div class="empty-msg">لا يوجد</div>`;
  updated.forEach(t=>{ html += renderTaskCard(t,false); });
  html += `</div>`;

  el.innerHTML = html;
  loadDoneToday();
}

async function loadDoneToday(){
  const archive = await storageGet(ARCHIVE_KEY, true, []);
  const today = new Date().toDateString();
  const count = archive.filter(t => t.confirmedAt && new Date(t.confirmedAt).toDateString() === today).length;
  const elCount = document.getElementById('doneTodayCount');
  if(elCount) elCount.textContent = count;
}
</script>
</body>
